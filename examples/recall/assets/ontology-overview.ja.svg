<svg xml:lang="ja" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1230" role="img" aria-labelledby="title desc">
  <title id="title">リコール：対象顧客を探し、サポートに起票する</title>
  <desc id="desc">リコールモデルの全4オブジェクト型と全4リンク型。CustomerはOrderとRecallTicketへ、OrderはProductへ、ProductはRecallTicketへつながる。すべてソース由来。filter・pivot・subtractでチケットがない7顧客を選ぶ。createRecallTicketが出荷済み注文と重複を再検査し、顧客・商品への参照を持つチケットをサポートに保存する。再読み込み後に対象10顧客すべてにチケットがあることを確認する。属性は抜粋。</desc>
  <!-- Edit this SVG, then export its PNG at 2x with:
       rsvg-convert -w 2400 -o ontology-overview.ja.png ontology-overview.ja.svg -->
  <defs>
    <style>text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "Hiragino Sans", "Noto Sans JP", sans-serif; }</style>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5B626B"/></marker>
  </defs>
  <rect width="1200" height="1230" fill="#FFFFFF"/>
  <text x="54" y="65" font-size="29" font-weight="760" fill="#20242A">リコール：対象顧客を探し、サポートに起票する</text>
  <text x="54" y="101" font-size="19" font-weight="500" fill="#747B84">オブジェクト型 4 · リンク型 4 · Action 1 · ERP + support</text>

  <rect x="54" y="140" width="1092" height="630" rx="30" fill="#FFFFFF" stroke="#20242A" stroke-width="3"/>
  <text x="84" y="183" font-size="17" font-weight="760" fill="#20242A" letter-spacing="1.2">オブジェクト型とリンク</text>
  <text x="1116" y="183" text-anchor="end" font-size="16" font-weight="500" fill="#747B84">主な属性を抜粋 · 主キー：id</text>

  <!-- Schema arrows are declared from → to, not the exploration sequence. -->
  <g data-link="customerOrders" data-from="Customer" data-to="Order" data-kind="one-to-many">
    <path d="M 394 310 H 802" fill="none" stroke="#5B626B" stroke-width="2.8" marker-end="url(#arrow-gray)"/>
    <text x="598" y="292" text-anchor="middle" font-size="17" font-weight="650" fill="#5B626B">customerOrders</text>
    <text x="598" y="338" text-anchor="middle" font-size="15" font-weight="500" fill="#747B84">1:N</text>
  </g>
  <g data-link="orderProducts" data-from="Order" data-to="Product" data-kind="many-to-many">
    <path d="M 952 378 V 558" fill="none" stroke="#5B626B" stroke-width="2.8" marker-end="url(#arrow-gray)"/>
    <rect x="856" y="434" width="192" height="61" rx="6" fill="#FFFFFF"/>
    <text x="952" y="456" text-anchor="middle" font-size="17" font-weight="650" fill="#5B626B">orderProducts</text>
    <text x="952" y="482" text-anchor="middle" font-size="15" font-weight="500" fill="#747B84">M:N</text>
  </g>
  <g data-link="customerRecallTickets" data-from="Customer" data-to="RecallTicket" data-kind="one-to-many">
    <path d="M 244 378 V 558" fill="none" stroke="#5B626B" stroke-width="2.8" marker-end="url(#arrow-gray)"/>
    <rect x="129" y="434" width="230" height="61" rx="6" fill="#FFFFFF"/>
    <text x="244" y="456" text-anchor="middle" font-size="17" font-weight="650" fill="#5B626B">customerRecallTickets</text>
    <text x="244" y="482" text-anchor="middle" font-size="15" font-weight="500" fill="#747B84">1:N</text>
  </g>
  <g data-link="productRecallTickets" data-from="Product" data-to="RecallTicket" data-kind="one-to-many">
    <path d="M 802 626 H 394" fill="none" stroke="#5B626B" stroke-width="2.8" marker-end="url(#arrow-gray)"/>
    <text x="598" y="608" text-anchor="middle" font-size="17" font-weight="650" fill="#5B626B">productRecallTickets</text>
    <text x="598" y="654" text-anchor="middle" font-size="15" font-weight="500" fill="#747B84">1:N</text>
  </g>

  <g data-object="Customer" data-properties="name region">
    <rect x="94" y="242" width="300" height="136" rx="21" fill="#F8F9FA" stroke="#343A42" stroke-width="2.5"/>
    <text x="116" y="280" font-size="23" font-weight="730" fill="#20242A">Customer</text>
    <text x="116" y="312" font-size="17" font-weight="500" fill="#5B626B">name · region</text>
    <text x="116" y="353" font-size="16" font-weight="600" fill="#747B84">north + south</text>
  </g>
  <g data-object="Order" data-properties="status total sourceSystem sourceId">
    <rect x="802" y="242" width="300" height="136" rx="21" fill="#F8F9FA" stroke="#343A42" stroke-width="2.5"/>
    <text x="824" y="280" font-size="23" font-weight="730" fill="#20242A">Order</text>
    <text x="824" y="312" font-size="17" font-weight="500" fill="#5B626B">status · total</text>
    <text x="824" y="336" font-size="17" font-weight="500" fill="#5B626B">sourceSystem · sourceId</text>
    <text x="824" y="361" font-size="16" font-weight="600" fill="#747B84">north + south</text>
  </g>
  <g data-object="Product" data-properties="name stock">
    <rect x="802" y="558" width="300" height="136" rx="21" fill="#F8F9FA" stroke="#343A42" stroke-width="2.5"/>
    <text x="824" y="596" font-size="23" font-weight="730" fill="#20242A">Product</text>
    <text x="824" y="628" font-size="17" font-weight="500" fill="#5B626B">name · stock</text>
    <text x="824" y="669" font-size="16" font-weight="600" fill="#747B84">south.ITEM_MASTER</text>
  </g>
  <g data-object="RecallTicket" data-properties="note recordedOn author">
    <rect x="94" y="558" width="300" height="136" rx="21" fill="#F8F9FA" stroke="#343A42" stroke-width="2.5"/>
    <text x="116" y="596" font-size="23" font-weight="730" fill="#20242A">RecallTicket</text>
    <text x="116" y="628" font-size="17" font-weight="500" fill="#5B626B">note · recordedOn · author</text>
    <text x="116" y="669" font-size="16" font-weight="600" fill="#747B84">support.tickets</text>
  </g>

  <path d="M 84 721 H 120" stroke="#5B626B" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <text x="133" y="726" font-size="17" font-weight="600" fill="#5B626B">全オブジェクト・リンクがソース由来</text>
  <text x="655" y="726" font-size="17" font-weight="500" fill="#5B626B">矢印は定義上の from → to</text>
  <text x="84" y="751" font-size="16" font-weight="500" fill="#747B84">1:N = 1対多 · M:N = 多対多</text>
  <text x="655" y="751" font-size="16" font-weight="500" fill="#747B84">pivot はリンクを両方向に辿れる</text>

  <text x="54" y="812" font-size="17" font-weight="760" fill="#20242A" letter-spacing="1.2">探索と書き戻し</text>
  <rect x="54" y="835" width="530" height="314" rx="24" fill="#F8F9FA" stroke="#5B626B" stroke-width="2.5"/>
  <rect x="610" y="835" width="536" height="314" rx="24" fill="#EFF5FC" stroke="#245EA8" stroke-width="2.5"/>
  <text x="80" y="872" font-size="16" font-weight="750" fill="#5B626B" letter-spacing="1">デモ · 起票する顧客を選ぶ</text>
  <path d="M 644 853 L 656 866 L 644 879 L 632 866 Z" fill="#FFFFFF" stroke="#245EA8" stroke-width="2"/>
  <text x="670" y="872" font-size="16" font-weight="750" fill="#245EA8" letter-spacing="1">ACTION · 書き戻しと監査</text>

  <g data-exploration="customers-without-tickets">
    <text x="80" y="916" font-size="23" font-weight="730" fill="#20242A">Filter → Pivot → Subtract</text>
    <text x="80" y="955" font-size="18" font-weight="500" fill="#5B626B">48注文 → 出荷済み31注文 → 10顧客</text>
    <text x="80" y="991" font-size="18" font-weight="500" fill="#5B626B">商品 → 既存チケット → 3顧客</text>
    <text x="80" y="1040" font-size="25" font-weight="730" fill="#20242A">10 − 3 = 起票する7顧客</text>
    <text x="80" y="1083" font-size="18" font-weight="500" fill="#5B626B">同じ商品のチケットがある顧客を除く</text>
    <text x="80" y="1122" font-size="17" font-weight="550" fill="#5B626B">複数の注文があっても、起票は顧客ごとに1件</text>
  </g>
  <g data-action="createRecallTicket">
    <text x="636" y="916" font-size="23" font-weight="730" fill="#20242A">createRecallTicket</text>
    <text x="636" y="955" font-size="18" font-weight="500" fill="#5B626B">顧客 + 商品 + 事前に決めたID</text>
    <text x="636" y="991" font-size="18" font-weight="500" fill="#5B626B">出荷済み注文とチケットの重複を再検査</text>
    <rect x="636" y="1012" width="484" height="71" rx="12" fill="#FFFFFF" stroke="#B8CEE9" stroke-width="1.5"/>
    <text x="655" y="1041" font-size="21" font-weight="730" fill="#245EA8">INSERT → support.tickets</text>
    <text x="655" y="1068" font-size="17" font-weight="500" fill="#5B626B">チケットと顧客・商品への参照を保存</text>
    <text x="636" y="1122" font-size="17" font-weight="650" fill="#245EA8">再読み込み → 10 / 10顧客にチケットあり</text>
  </g>
  <text x="600" y="1183" text-anchor="middle" font-size="18" font-weight="550" fill="#5B626B">新規7件 · 重複拒否1件 · Actionの監査記録8件</text>
  <text x="1146" y="1214" text-anchor="end" font-size="16" font-weight="500" fill="#747B84">Operational Ontology · リコール例</text>
</svg>
