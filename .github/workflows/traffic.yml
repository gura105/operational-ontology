name: Traffic

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays. GitHub keeps 14 days, so weekly runs overlap by a week.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic
  cancel-in-progress: false

jobs:
  traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: traffic
          path: traffic
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Record the last 14 days
        env:
          # GITHUB_TOKEN cannot read traffic. Use a fine-grained personal access
          # token limited to this repository with "Administration: Read-only".
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: node .github/scripts/traffic.mjs traffic
      - name: Commit to the traffic branch
        working-directory: traffic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'Nothing new to record.'
          else
            git commit -m "traffic: $(date -u +%F)" && git push
          fi
