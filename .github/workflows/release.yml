name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version without v (for example 0.5.0)'
        required: true
        type: string
      commit:
        description: 'Exact 40-character commit on main'
        required: true
        type: string
      notes:
        description: 'Release notes, including API migration'
        required: true
        type: string
      dry_run:
        description: 'Validate without creating a tag or Release'
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_NOTES: ${{ inputs.notes }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: node .github/scripts/release.mjs
